services:
  admin:
    image: ghcr.io/sondregronas/edugamedist
    restart: unless-stopped
    command:
      - gunicorn
      - --worker-class
      - gthread
      - --workers
      - "2"
      - --threads
      - "4"
      - --timeout
      - "0"
      - --bind
      - 0.0.0.0:8081
      - app:create_admin_app()
    expose:
      - 8081
    volumes:
      # Game files, stored as ./games/<Platform>/<game>/<file name>. Admin needs write access.
      - ./games:/app/public/games
      - game_db:/app/data
      - game_covers:/app/data/legacy-covers
    environment:
      # Default site title. It can be changed under Settings in admin.
      - TITLE=Spillserver
      - DATA_DIR=/app/data
      - PUBLIC_URL=${PUBLIC_URL:-http://localhost/}
      # Admin password. Empty = no login (rely on NPM access control).
      # A password saved under Settings in admin takes precedence over this one.
      # GitHub login for chosen GitHub users is set up under Settings as well.
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      # true = logging in with the password is always allowed, even if it is turned off under Settings.
      - FORCE_PASSWORD_LOGIN=${FORCE_PASSWORD_LOGIN:-false}
      # true = only ADMIN_PASSWORD is used. A password saved under Settings is ignored and cannot be
      # changed there. Use it to get back in if the saved password is lost.
      - FORCE_ENV_PASSWORD=${FORCE_ENV_PASSWORD:-false}
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 5
      # The first start after upgrading moves existing uploads into ./games, which can take a while.
      start_period: 30m
    networks:
      - default
      - npm_proxy

  frontend:
    image: ghcr.io/sondregronas/edugamedist
    restart: unless-stopped
    ports:
      - 80:80
    depends_on:
      admin:
        condition: service_healthy
    volumes:
      - ./games:/app/public/games:ro
      - game_db:/app/data
      - game_covers:/app/data/legacy-covers
    environment:
      - TITLE=Spillserver
      - DATA_DIR=/app/data

networks:
  npm_proxy:
    name: edugamedist_proxy_access
    driver: bridge

volumes:
  game_db:
  game_covers:
