{% extends "base.html" %}
{% from "_macros.html" import icon %}
{% block content %}
<section class="login-card">
  {{ icon('lock') }}
  <h1>Logg inn</h1>
  <p class="hint">Skriv inn administratorpassordet for å redigere spillene.</p>
  <form method="post" action="/login">
    <input type="hidden" name="next" value="{{ next }}">
    <label class="field"><span>Passord</span><input type="password" name="password" autocomplete="current-password" autofocus required></label>
    {% if error %}<p class="form-error" role="alert">{{ error }}</p>{% endif %}
    <button type="submit" class="btn btn-primary">{{ icon('check') }}Logg inn</button>
  </form>
</section>
{% endblock %}
