name: CI

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

env:
  docker-container: sondregronas/edugamedist
  platforms: linux/amd64,linux/arm64/v8,linux/arm/v7

on:
  push:
    branches: [main]
    tags: [v*]
    paths-ignore:
      - '.github/workflows/Pages.yml'
      - 'README.md'
      - 'CONTRIBUTING.md'
      - 'docker-compose.yml'
      - 'src/demo-img/**'
      - 'docs/**'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install application dependencies
        run: python -m pip install -r src/requirements.txt

      - name: Run application tests
        run: python -m unittest discover -s src/tests -v

      - name: Prepare
        id: prepare
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            tag=${GITHUB_REF#refs/tags/}
          elif [[ $GITHUB_REF == refs/heads/main ]]; then
            tag=latest
          else
            tag=${GITHUB_REF#refs/heads/}
          fi
          if [[ $GITHUB_REF == refs/tags/*-beta ]]; then
            branch=beta
          elif [[ $GITHUB_REF == refs/tags/* ]]; then
            branch=main
          else
            branch=${GITHUB_REF#refs/heads/}
          fi
          {
            echo "tag=$tag"
            echo "branch=$branch"
            echo "commit=${GITHUB_SHA}"
            echo "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            echo "docker_platforms=${{ env.platforms }}"
            echo "docker_image=${{ env.docker-container }}"
          } >> "$GITHUB_OUTPUT"

      - name: Set Up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        id: buildx

      - name: Cache Docker Layers
        uses: actions/cache@v6
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-
      - name: Log into registry GHCR
        if: success()
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Build and Push
        uses: docker/build-push-action@v7
        if: success()
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: ${{ steps.prepare.outputs.docker_platforms }}
          build-args: |
            TAG=${{ steps.prepare.outputs.tag }}
            BRANCH=${{ steps.prepare.outputs.branch }}
            COMMIT=${{ steps.prepare.outputs.commit }}
            BUILD_DATE=${{ steps.prepare.outputs.build_date }}
          tags: |
            ghcr.io/${{ steps.prepare.outputs.docker_image }}:${{ steps.prepare.outputs.tag }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache
